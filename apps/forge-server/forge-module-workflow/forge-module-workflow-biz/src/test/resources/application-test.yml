forge:
  info:
    base-package: com.forge
  tenant:
    enable: false

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:workflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  quartz:
    auto-startup: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - com.forge.framework.redis.config.CacheConfig
      - com.forge.framework.redis.config.RedisConfig


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

flowlong:
  scheduler:
    enabled: false

logging:
  level:
    com.aizuda.bpm: WARN
    com.forge.modules.workflow: WARN
