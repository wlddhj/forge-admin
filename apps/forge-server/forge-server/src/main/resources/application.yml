server:
  port: ${SERVER_PORT:8181}

spring:
  # 邮件提醒 SMTP（flowlong.scheduler.email-enabled=true 时生效）
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  application:
    name: ${PROJECT_NAME:forge-admin}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    allow-bean-definition-overriding: true

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:forge_admin}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# FlowLong 工作流引擎配置
flowlong:
  banner: false
  # Spring 事件发布配置
  eventing:
    task: true      # 启用任务事件监听，用于候选人分配和通知
    instance: true  # 启用实例事件监听，用于流程生命周期追踪
  # 调度器配置（超时检查和任务提醒）
  scheduler:
    enabled: true                           # 是否启用调度器
    timeout-check-interval: 60              # 超时检查间隔（秒）
    reminder-check-interval: 300            # 提醒检查间隔（秒）
    reminder-advance-minutes: 30            # 提醒提前时间（分钟）
    use-distributed-lock: true              # 使用分布式锁防止重复执行
    lock-type: redis                        # 分布式锁类型：redis / database
    lock-timeout-seconds: 30                # 锁超时时间（秒）
    max-reminder-count: 3                   # 最大提醒次数
    reminder-interval-hours: 24             # 提醒间隔（小时）
    urge-interval-minutes: 30               # 手动催办节流窗口（分钟）
    email-enabled: ${FLOWLONG_EMAIL_ENABLED:false}   # 邮件提醒渠道开关（需配置 spring.mail）
    email-from: ${FLOWLONG_EMAIL_FROM:no-reply@forge-admin.local}
    work-time: "8:00-18:00"                # 提醒工作时段（空=不限）
    work-days: "1,2,3,4,5"                 # 提醒工作日（空=不限）


forge:
  info:
    base-package: com.forge
  ai:
    agent:
      sql-result-char-budget: ${AI_AGENT_SQL_BUDGET:6000}     # SQL 工具结果字符预算
      http-max-response-bytes: ${AI_AGENT_HTTP_MAX_BYTES:1048576}  # HTTP 工具响应字节上限
      expert-parallelism: ${AI_AGENT_EXPERT_PARALLELISM:2}    # 团队图专家并行度
      checkpoint-interval-team: ${AI_AGENT_CKPT_INTERVAL:2}   # 团队图检查点节流间隔
      step-batch-size: ${AI_AGENT_STEP_BATCH:8}               # 步骤事件批量落库阈值
      image-cache-ttl-minutes: ${AI_AGENT_IMAGE_CACHE_TTL:60} # 图片识别缓存(0=禁用)
      executor:
        core: ${AI_AGENT_EXEC_CORE:8}                         # Agent 专用线程池
        max: ${AI_AGENT_EXEC_MAX:16}
        queue: ${AI_AGENT_EXEC_QUEUE:200}
      allowed-hosts:
        - "*"            # 放行全部，仅建议开发环境
  tenant:
    enable: ${TENANT_ENABLE:false}          # 关闭多租户时改为 false
    header: X-Tenant-Id
    # 忽略租户识别的 URL（登录、刷新、租户公开信息等）
    ignore-urls:
      - /admin-api/auth/login
      - /admin-api/auth/refresh
      - /admin-api/auth/captcha
      - /admin-api/auth/captcha-image
      - /admin-api/auth/change-password-first-login
      - /admin-api/system/tenant/public/**
      - /admin-api/system/brand/public
      - /admin-api/system/public/**
      - /app-api/auth/wx-login
      - /doc.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /swagger-resources/**
      - /webjars/**
      - /error
      # WebSocket 端点（SockJS 信息接口、STOMP 子协议、xhr 流传输），不会自动带 X-Tenant-Id
      - /ws
      - /ws/**
      - /ws/info
      - /ws/*/websocket
      - /ws/*/xhr
      - /ws/*/xhr_send
      - /ws/*/xhr_streaming
    # 跨租户共享的表（不注入 tenant_id）
    ignore-tables:
      - sys_menu
      - sys_role
      - sys_role_menu
      - sys_dict_type
      - sys_dict_data
      - sys_config
      - sys_file_config
      - sys_job
      - sys_tenant
      - sys_tenant_package
      - sys_tenant_package_menu
      - sys_tenant_package_role
      - sys_print_template
      - ai_sql_whitelist
      - ai_model_config
    # 跨租户共享的缓存名（key 不加 tenantId 前缀）
    ignore-caches:
      - dictData
      - dictType
      - sysConfig
      - menu
      - dept
  web:
    admin-api:
      prefix: /admin-api
      controller: "**.controller.admin.**"
    app-api:
      prefix: /app-api
      controller: "**.controller.app.**"
  wx:
    mini-app-id: ${WX_MINI_APP_ID:}
    mini-app-secret: ${WX_MINI_APP_SECRET:}
  sms:
    code-length: 6
    code-ttl-seconds: 300
    send-cooldown-seconds: 60
    daily-limit: 5
    verify-error-limit: 5
  security:
    captcha:
      enabled: true
      length: 4
      expire-seconds: 300
      width: 120
      height: 40
    password:
      min-length: 8
      max-length: 32
      require-uppercase: false
      require-lowercase: false
      require-digit: false
      require-special: false
      history-size: 5
      expire-days: 90
      bcrypt-strength: 12
      aes-key: ${APP_AES_KEY:default-aes-key-change-in-prod-32bytes!}
      random-password-length: 12
    login:
      max-fail-count: 5
      lock-minutes: 15
      single-session: true
      max-concurrent-sessions: 3
    upload:
      max-size: 10485760
      allowed-extensions:
        - jpg
        - jpeg
        - png
        - gif
        - webp
        - bmp
        - pdf
        - doc
        - docx
        - xls
        - xlsx
        - ppt
        - pptx
        - txt
        - csv
        - md
        - json
      enable-magic-check: true
    cors-allowed-origins:
      - "*"
    sensitive-data-masking: true
    # 大屏模块安全配置：HTTP 数据源 SSRF 防护、超时、限体、HTTPS 强制
    screen:
      allowed-hosts:
        - localhost
        - 127.0.0.1
        - forge-server
        - jsonplaceholder.typicode.com
        - api.github.com
        - www.npt-cn.com
      http-timeout-ms: 5000
      http-max-body-bytes: 1048576
      require-https: false

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.forge.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
   # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false # 关闭控制台的 Banner 打印

# Flowable 工作流引擎配置
flowable:
  database-schema-update: true
  history-level: full
  async-executor-activate: true
  process-definition-location-prefix: classpath*:/processes/

# OpenAPI 文档（springdoc，UI: /api/swagger-ui.html）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.forge.modules

# JWT配置
jwt:
  secret: ${JWT_SECRET:standadmin-jwt-secret-key-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:7200000} # 2小时
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7天
  header: Authorization
  prefix: Bearer

# 日志配置
logging:
  level:
    com.forge: ${LOG_LEVEL:debug}
    org.springframework.security: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: ${LOG_PATH:logs}/forge-admin.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

# AI模块配置
ai:
  enabled: ${AI_ENABLED:true}
  client:
    connect-timeout: ${AI_CLIENT_CONNECT_TIMEOUT:5000}
    read-timeout: ${AI_CLIENT_READ_TIMEOUT:120000}
    decision-timeout: ${AI_CLIENT_DECISION_TIMEOUT:45000}
    summary-timeout: ${AI_CLIENT_SUMMARY_TIMEOUT:60000}      # 总结流式聚合超时
    failover-parallelism: ${AI_CLIENT_FAILOVER_PARALLELISM:2}
    health-cache-ttl-ms: ${AI_CLIENT_HEALTH_CACHE_TTL:60000}   # 模型健康负缓存 TTL
  models:
    default-model: ${AI_DEFAULT_MODEL:deepseek-chat}
    default-temperature: ${AI_DEFAULT_TEMPERATURE:0.7}
    default-max-tokens: ${AI_DEFAULT_MAX_TOKENS:4096}
    cache-enabled: ${AI_MODEL_CACHE_ENABLED:true}
    cache-expire-seconds: ${AI_MODEL_CACHE_EXPIRE:3600}


# 监控指标（等保最小暴露：仅健康检查与 Prometheus 抓取）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
