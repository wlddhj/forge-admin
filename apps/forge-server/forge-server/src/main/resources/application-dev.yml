# 开发环境配置
server:
  port: 8180

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/forge_admin?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password

  data:
    redis:
      host: localhost
      port: 6379
      password:

# 文件存储配置
file:
  storage:
    type: local
    local:
      path: /tmp/forge-admin/upload
      url-prefix: http://localhost:8180/api/file/

# JustAuth 第三方登录配置
justauth:
  type:
    wechat:
      client-id: ${WECHAT_APP_ID:}
      client-secret: ${WECHAT_APP_SECRET:}
      redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:3000/api/auth/social/callback/wechat}
    dingtalk:
      client-id: ${DINGTALK_APP_KEY:}
      client-secret: ${DINGTALK_APP_SECRET:}
      redirect-uri: ${DINGTALK_REDIRECT_URI:http://localhost:3000/api/auth/social/callback/dingtalk}
    # 企业微信 OAuth 扫码绑定通道（凭据与 im.notify.wework 共用同一个企微自建应用）
    wework:
      client-id: ${WEWORK_CORP_ID:}
      client-secret: ${WEWORK_SECRET:}
      agent-id: ${WEWORK_AGENT_ID:}
      redirect-uri: ${WEWORK_REDIRECT_URI:http://localhost:3000/api/auth/social/callback/wework}

# 日志级别
logging:
  level:
    com.forge: info
    com.forge.modules.system.mapper: info

# 等保安全策略（开发环境覆盖）
forge:
  plugin:
    license:
      # 开发环境启用 License 在线签发（开发私钥，与 classpath 公钥配对）；
      # 生产/私有化交付不配置此项——签发入口自动隐藏，仅保留导入
      private-key: ${PLUGIN_LICENSE_PRIVATE_KEY:}
  security:
    captcha:
      enabled: false  # 临时关闭做集成测试，生产环境必须开启
    password:
      # 开发专用密钥（仅 dev profile 生效）；生产必须经 APP_AES_KEY 环境变量注入，基础配置无默认值
      aes-key: dev-only-aes-key-32bytes-do-not-use-prod!
  wx:
    # 开发环境允许 Mock 登录（appId 未配置时以模拟 openId 建号）；生产走默认 false，漏配直接失败
    mock-enabled: true

# 开发专用 JWT 密钥（仅 dev profile 生效）；生产必须经 JWT_SECRET 环境变量注入，基础配置无默认值
jwt:
  secret: dev-only-jwt-secret-key-256-bits-minimum-ok!
